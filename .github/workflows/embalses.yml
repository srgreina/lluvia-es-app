name: Embalses (volumen diario)

on:
  schedule:
    - cron: "41 8 * * *"   # una vez al día, 08:41 UTC (el informe se actualiza por la mañana)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingesta-datos
  cancel-in-progress: false

jobs:
  embalses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar repo de datos
        uses: actions/checkout@v4
        with:
          repository: srgreina/lluvia-es-datos
          token: ${{ secrets.DATOS_TOKEN }}
          path: datos

      - name: Leer embalses
        run: python -m ingest.embalses --data-dir datos

      - name: Publicar en el repo de datos
        working-directory: datos
        run: |
          git config user.name "lluvia-es-bot"
          git config user.email "lluvia-es-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Embalses $(date -u +%Y-%m-%d)"
            git pull --rebase -q
            git push
          fi

name: Catálogo (estaciones y municipios)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 2 * *"   # día 2 de cada mes, 04:23 UTC (antes del histórico del día 3)

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar repo de datos
        uses: actions/checkout@v5
        with:
          repository: srgreina/lluvia-es-datos
          token: ${{ secrets.DATOS_TOKEN }}
          path: datos

      - name: Generar catálogo
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python -m ingest.catalogo --data-dir datos

      - name: Publicar en el repo de datos
        working-directory: datos
        run: |
          git config user.name "lluvia-es-bot"
          git config user.email "lluvia-es-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Catálogo de estaciones y municipios"
            git push
          fi

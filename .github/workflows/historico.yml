name: Histórico mensual (climatología)

on:
  workflow_dispatch:
    inputs:
      anio_ini:
        description: "Año inicial"
        default: "1996"
      anio_fin:
        description: "Año final (vacío = año anterior)"
        default: ""
  schedule:
    - cron: "17 5 3 * *"   # día 3 de cada mes, 05:17 UTC

permissions:
  contents: read

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar repo de datos
        uses: actions/checkout@v5
        with:
          repository: srgreina/lluvia-es-datos
          token: ${{ secrets.DATOS_TOKEN }}
          path: datos

      - name: Generar histórico mensual
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          ANIO_INI: ${{ inputs.anio_ini || '1996' }}
          ANIO_FIN: ${{ inputs.anio_fin }}
        run: |
          args="--data-dir datos --anio-ini $ANIO_INI"
          if [ -n "$ANIO_FIN" ]; then args="$args --anio-fin $ANIO_FIN"; fi
          python -m ingest.historico $args

      - name: Publicar en el repo de datos
        working-directory: datos
        run: |
          git config user.name "lluvia-es-bot"
          git config user.email "lluvia-es-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Histórico mensual de precipitación"
            git push
          fi

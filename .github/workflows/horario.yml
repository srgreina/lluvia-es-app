name: Ingesta horaria

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, minuto 7 (evita la hora en punto)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingesta-datos
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar repo de datos
        uses: actions/checkout@v5
        with:
          repository: srgreina/lluvia-es-datos
          token: ${{ secrets.DATOS_TOKEN }}
          path: datos

      - name: Ingesta
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python -m ingest.horario --data-dir datos

      - name: Publicar en el repo de datos
        working-directory: datos
        run: |
          git config user.name "lluvia-es-bot"
          git config user.email "lluvia-es-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Ingesta horaria $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

name: Ingesta diaria (completa semana y mes)

on:
  schedule:
    - cron: "17 9 * * *"    # una vez al día; AEMET publica el dato diario con unos días de retraso
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingesta-datos
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar repo de datos
        uses: actions/checkout@v5
        with:
          repository: srgreina/lluvia-es-datos
          token: ${{ secrets.DATOS_TOKEN }}
          path: datos

      - name: Datos diarios
        id: diario
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python -m ingest.diario --data-dir datos

      - name: Publicar en el repo de datos
        working-directory: datos
        run: |
          git config user.name "lluvia-es-bot"
          git config user.email "lluvia-es-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos diarios $(date -u +%Y-%m-%d)"
            git pull --rebase -q
            git push
          fi

      - name: Avisar si la descarga no fue fiable
        if: steps.diario.outcome == 'failure'
        run: |
          echo "::error::La ingesta diaria no fue fiable (ver el paso 'Datos diarios')"
          exit 1

# Configuración de la ingesta. Para ampliar a otra provincia basta cambiar estos valores.
provincia_nombre: MALAGA   # tal como aparece en el inventario de estaciones de AEMET (mayúsculas, sin tildes)
provincia_ine: "29"        # código INE de provincia (prefijo de los municipios)
umbral_aviso_km: 15        # a partir de esta distancia el dato del municipio se marca como orientativo
horas_ventana: 24          # horas que se muestran en latest.json

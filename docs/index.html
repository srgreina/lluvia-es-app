<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b73">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lluvia en Málaga</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%2211%22 y=%222%22 width=%2210%22 height=%2228%22 rx=%225%22 fill=%22none%22 stroke=%22%230f6b73%22 stroke-width=%223%22/%3E%3Crect x=%2213%22 y=%2216%22 width=%226%22 height=%2212%22 rx=%223%22 fill=%22%234aa3e8%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
:root{
  --bg:#edf2f1; --card:#fbfdfc; --fg:#10282e; --muted:#53686d; --line:#d3dedd; --accent:#0f6b73; --accent-ink:#ffffff;
  --b0:#c5d1d3; --b1:#9ad0f5; --b2:#4aa3e8; --b3:#1d6fd1; --b4:#7b3fc4; --b5:#c2185b; --b0t:#10282e;
  --warn-bg:#fff1cf; --warn-fg:#664700; --ok-bg:#d9f0e2; --ok-fg:#12532a; --near-bg:#dcedf0; --near-fg:#0b4a52;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1a1e; --card:#14262b; --fg:#e4eeee; --muted:#9bb1b5; --line:#274047; --accent:#5fc3cb; --accent-ink:#06262a;
    --b0:#3a5057; --b0t:#e4eeee; --warn-bg:#3b3010; --warn-fg:#f3d98b; --ok-bg:#16361f; --ok-fg:#9be0b0; --near-bg:#17323a; --near-fg:#a5d8df;
  }
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--text);-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:flex;flex-direction:column;min-height:100%}
header{padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{margin:0;font:700 32px/1.05 var(--display);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:4px;max-width:64ch}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;min-width:44px;height:44px;font-size:20px;cursor:pointer}
.icon-btn:active{transform:scale(.97)}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding:6px calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--fg);padding:0 13px;height:44px;font:600 17px var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{flex:1 1 240px;display:flex;gap:8px;min-width:0}
.search input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--card);color:var(--fg)}
.btn{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:0 14px;font:inherit;cursor:pointer;white-space:nowrap}
main{display:grid;grid-template-columns:1fr;gap:14px;padding:0 calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
#map{height:46vh;min-height:300px;border-radius:14px;border:1px solid var(--line);z-index:0}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
.card{padding:16px 18px;border-top:1px solid var(--line)}
.card:first-child{border-top:0}
.card h2{margin:0 0 8px;font:600 18px/1.2 var(--display)}
#detail h2{font:700 28px/1.1 var(--display);margin:0 0 8px}
.banner{margin:0 16px 10px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-fg);font-size:15px}
.banner[hidden]{display:none}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg)}
.badge.near{background:var(--near-bg);color:var(--near-fg)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.reading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:14px 0 4px}
.num{font:700 60px/.95 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num small{font:500 20px var(--display);color:var(--muted);margin-left:6px;letter-spacing:0}
.num.empty{font-size:34px;color:var(--muted)}
.note{color:var(--muted);font-size:14px}
.gauge{display:flex;gap:6px;height:132px;flex:none}
.tube{position:relative;width:30px;height:100%;border:2px solid var(--fg);border-radius:8px 8px 17px 17px;overflow:hidden}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .6s cubic-bezier(.2,.7,.2,1)}
.ticks{position:relative;width:34px;height:calc(100% - 4px);margin:2px 0}
.tick{position:absolute;left:0;display:flex;align-items:center;gap:4px;font:500 12px/1 var(--text);color:var(--muted);transform:translateY(50%)}
.tick::before{content:"";width:8px;border-top:1.5px solid var(--fg)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.chip{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:7px 4px;font:inherit;text-align:center;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip b{display:block;font:700 19px var(--display)}
.chip span{font-size:13px;color:var(--muted)}
.chartbox{position:relative;height:170px}
ol.rank{list-style:none;margin:0;padding:0}
ol.rank li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;min-height:44px}
ol.rank li:first-child{border-top:0}
ol.rank .dot{width:12px;height:12px;border-radius:50%;flex:none}
ol.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.rank .v{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.foot{margin:0;padding:14px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot a{color:var(--accent)}
.pin{display:flex;align-items:center;justify-content:center;width:36px;height:26px;border-radius:13px;font:700 14px/1 var(--display);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.pin.b0{background:var(--b0);color:var(--b0t)}
.pin.b1{background:var(--b1);color:#0d1b2a}
.pin.b2{background:var(--b2)} .pin.b3{background:var(--b3)} .pin.b4{background:var(--b4)} .pin.b5{background:var(--b5)}
.pin.sel{border-color:#ffd54a;box-shadow:0 0 0 3px #ffd54a,0 1px 6px rgba(0,0,0,.6)}
.pin.nodata{opacity:.55}
.pin.cluster{width:46px;height:30px;border-radius:15px;position:relative}
.pin.cluster .n{position:absolute;top:-8px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--fg);color:var(--bg);font:600 11px/18px var(--text);text-align:center;border:1.5px solid #fff}
.homepin{width:14px;height:14px;border-radius:50%;background:#111;border:3px solid #ffd54a;box-shadow:0 0 0 2px #111}
.err{color:var(--b5)}

.normal{margin:14px 0 4px}
.normal h3{margin:14px 0 6px;font:600 16px var(--display)}
.normal .note{margin:6px 0}
.normal .small{font-size:12.5px}
.emb{margin:10px 0 14px}
.emb-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.emb-nom{font:600 16px var(--display)}
.emb-pct{font:700 20px var(--display);font-variant-numeric:tabular-nums}
.emb-barra{position:relative;height:12px;margin:5px 0 4px;background:var(--bg);border-radius:6px}
.emb-barra i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--b2)}
.emb-barra b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.cmp-fila{display:grid;grid-template-columns:116px 1fr 86px;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.cmp-et{color:var(--muted)}
.cmp-barra{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.cmp-barra i{display:block;height:100%;border-radius:6px}
.cmp-barra .reg{background:var(--b2)}
.cmp-barra .nor{background:var(--muted);opacity:.55}
.cmp-v{text-align:right;font:600 15px var(--display);font-variant-numeric:tabular-nums}
.vistas{margin:14px 0 10px;display:flex}
.vistas button{flex:1;font:600 16px var(--display)}
.anio-row{display:flex;align-items:center;gap:12px;margin:10px 0}
.anio{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:600 17px var(--display);padding:0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:900px){
  body{height:100vh;overflow:hidden}
  .app{height:100vh}
  main{grid-template-columns:1fr 420px;flex:1;min-height:0;padding-bottom:16px}
  #map{height:100%;min-height:0}
  aside{overflow:auto}
}

/* Móvil en horizontal: el mapa ocupa toda la pantalla */
.mini{display:none}
@media (orientation:landscape) and (max-height:520px) and (max-width:1100px){
  body{height:100%;overflow:hidden}
  .app{height:100%;min-height:0}
  header,.search,aside{display:none}
  main{display:block;padding:0}
  #map{position:fixed!important;inset:0;width:100%;height:100%;min-height:0;border:0;border-radius:0;z-index:0}
  .controls{position:fixed;z-index:1000;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));padding:0;margin:0;display:block}
  .controls .seg{box-shadow:0 1px 6px rgba(0,0,0,.35)}
  .controls .seg button{height:40px;padding:0 14px}
  .banner{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));margin:0;max-width:60vw;font-size:13px}
  .leaflet-top.leaflet-left{top:calc(2px + env(safe-area-inset-top));left:env(safe-area-inset-left)}
  .mini{display:block;position:fixed;z-index:1000;left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));max-width:46vw;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:6px 12px;box-shadow:0 1px 6px rgba(0,0,0,.35);line-height:1.15}
  .mini .nm{display:block;font:600 14px var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .v{font:700 22px var(--display);font-variant-numeric:tabular-nums}
  .mini .u{font:500 13px var(--text);color:var(--muted);margin-left:4px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Lluvia en Málaga</h1>
      <div class="sub" id="updated">Cargando datos…</div>
    </div>
    <button class="icon-btn" id="reload" type="button" aria-label="Actualizar datos" title="Actualizar datos">⟳</button>
  </header>
  <div class="banner" id="banner" role="status" hidden></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Periodo">
      <button type="button" data-win="1h" aria-pressed="false">1 h</button>
      <button type="button" data-win="6h" aria-pressed="false">6 h</button>
      <button type="button" data-win="24h" aria-pressed="true">24 h</button>
      <button type="button" data-win="48h" aria-pressed="false">48 h</button>
      <button type="button" data-win="7d" aria-pressed="false">1 sem</button>
      <button type="button" data-win="30d" aria-pressed="false">1 mes</button>
    </div>
    <div class="search">
      <input id="muni" list="munis" type="search" placeholder="Buscar municipio…" autocomplete="off" aria-label="Buscar municipio">
      <button class="btn" id="geo" type="button" title="Usar mi ubicación"><span class="geo-t">Mi zona</span></button>
    </div>
    <datalist id="munis"></datalist>
  </div>
  <main>
    <div id="map" role="application" aria-label="Mapa de estaciones con la lluvia acumulada"></div>
    <aside>
      <section class="card" id="detail" aria-live="polite"></section>
      <section class="card">
        <h2 id="rank-title">Más lluvia</h2>
        <ol class="rank" id="rank"></ol>
      </section>
      <section class="card" id="embalses" hidden>
        <h2>Embalses de Málaga</h2>
        <div id="emb-lista"></div>
        <p class="note small" id="emb-fuente"></p>
      </section>
      <section class="card">
        <h2>Leyenda</h2>
        <div class="legend" id="legend"></div>
      </section>

      <p class="foot">
        Datos © <a href="https://www.aemet.es" target="_blank" rel="noopener">AEMET</a> (AEMET OpenData), valores en tiempo real sin validar.
        Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.
        Horas en horario de Madrid. <a href="https://github.com/srgreina/lluvia-es-app" target="_blank" rel="noopener">Código</a>.
      </p>
    </aside>
  </main>
</div>
<div class="mini" id="mini" aria-live="polite"></div>
<noscript><p style="padding:14px">Esta página necesita JavaScript.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(() => {
'use strict';

const qs = new URLSearchParams(location.search);
const BASE = (qs.get('data') || 'https://raw.githubusercontent.com/srgreina/lluvia-es-datos/main/').replace(/\/?$/, '/');
const TZ = 'Europe/Madrid';
const WINDOWS = {
  '1h':  {h: 1,  th: [0.1, 1, 4, 10, 20]},
  '6h':  {h: 6,  th: [0.1, 2, 8, 20, 40]},
  '24h': {h: 24, th: [0.1, 5, 15, 40, 80]},
  '48h': {h: 48, th: [0.1, 8, 25, 60, 120]},
  '7d':  {h: 168, th: [0.1, 15, 40, 100, 200]},
  '30d': {h: 720, th: [0.1, 30, 80, 180, 350]},
};
const ORDEN = ['1h', '6h', '24h', '48h', '7d', '30d'];
const winName = w => ({'7d': '1 semana', '30d': '1 mes'})[w] || w.replace('h', ' h');
const winShort = w => ({'7d': '1 sem', '30d': '1 mes'})[w] || w.replace('h', ' h');
const winUltimas = w => ({'7d': 'la última semana', '30d': 'el último mes'})[w] || `las últimas ${w.replace('h', ' h')}`;
const cap = s => s[0].toUpperCase() + s.slice(1);
const STALE_MIN = 240;
const MAX_GEO_KM = 60;

const fmt1 = new Intl.NumberFormat('es-ES', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const fmtPin = mm => mm == null ? '·' : (mm >= 10 ? String(Math.round(mm)) : (mm === 0 ? '0' : fmt1.format(mm)));
const tfHM = new Intl.DateTimeFormat('es-ES', {timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
const tfH = new Intl.DateTimeFormat('es-ES', {timeZone: TZ, hour: '2-digit', hourCycle: 'h23'});
const tfDay = new Intl.DateTimeFormat('es-ES', {timeZone: TZ, day: '2-digit', month: '2-digit'});

const $ = id => document.getElementById(id);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const safe = fn => { try { return fn(); } catch (e) { return null; } };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k instanceof Node ? k : document.createTextNode(k));
  return n;
}

const S = {win: '24h', est: {}, mun: [], asig: {}, latest: null, selMuni: null, selStation: null,
           vista: 'horas', anio: null, mensual: {}, map: null, pins: {}, homePin: null, link: null, chart: null, loaded: false};

/* ---------- datos ---------- */
async function getJSON(name) {
  const bust = Math.floor(Date.now() / 300000);
  const r = await fetch(`${BASE}${name}?v=${bust}`, {cache: 'no-store'});
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  return r.json();
}

let lastLoad = 0;

async function load() {
  lastLoad = Date.now();
  $('updated').textContent = 'Cargando datos…';
  try {
    const [est, mun, asig, latest] = await Promise.all(
      ['estaciones.json', 'municipios.json', 'municipio_estacion.json', 'latest.json'].map(getJSON));
    S.est = est; S.mun = mun; S.asig = asig; S.latest = latest;
    S.munByIne = Object.fromEntries(mun.map(m => [m.ine, m]));
    S.munByName = new Map(mun.map(m => [norm(m.nombre), m]));
    if (!S.loaded) { initMap(); initSearch(); applyInitialSelection(); S.loaded = true; loadEmbalses(); }
    render();
  } catch (e) {
    console.error(e);
    $('updated').replaceChildren(el('span', {class: 'err'}, 'No se pudieron cargar los datos. Pulsa ⟳ para reintentar.'));
  }
}

function acc(id, w = S.win) {
  const a = S.latest && S.latest.estaciones[id] && S.latest.estaciones[id].acumulado[w];
  return !a || a.horas_con_dato === 0 ? null : a;
}

/* ---------- escala de color ---------- */
function bucket(mm, th) {
  if (mm == null || mm < th[0]) return 0;
  let i = 1;
  while (i < th.length && mm >= th[i]) i++;
  return i;
}
const colorVar = b => `var(--b${b})`;

function legendLabels(th) {
  const f = x => String(x).replace('.', ',');
  const out = ['Sin lluvia'];
  for (let i = 0; i < th.length - 1; i++) out.push(`${f(th[i])}–${f(th[i + 1])}`);
  out.push(`≥ ${f(th[th.length - 1])}`);
  return out;
}

/* ---------- mapa ---------- */
function initMap() {
  S.map = L.map('map', {zoomControl: true, attributionControl: false}).setView([36.85, -4.5], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18}).addTo(S.map);
  L.control.attribution({prefix: false}).addAttribution('© OpenStreetMap').addTo(S.map);
  const pts = Object.values(S.est).map(e => [e.lat, e.lon]);
  if (pts.length) S.map.fitBounds(pts, {padding: [30, 30]});
  S.cluster = L.markerClusterGroup({
    maxClusterRadius: 50, showCoverageOnHover: false, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 11,
    iconCreateFunction: c => {
      const kids = c.getAllChildMarkers();
      const vals = kids.map(m => acc(m.options.eid)).filter(Boolean).map(a => a.mm);
      const mx = vals.length ? Math.max(...vals) : null;
      const b = bucket(mx, WINDOWS[S.win].th);
      const sel = kids.some(m => m.options.eid === S.selStation) ? ' sel' : '';
      return L.divIcon({className: '', iconSize: [46, 30], iconAnchor: [23, 15],
        html: `<div class="pin cluster b${b}${vals.length ? '' : ' nodata'}${sel}" title="${kids.length} estaciones, máximo de lluvia">${fmtPin(mx)}<span class="n">${kids.length}</span></div>`});
    },
  });
  for (const e of Object.values(S.est)) {
    const m = L.marker([e.lat, e.lon], {icon: pinIcon(e.id), keyboard: true, title: e.nombre, riseOnHover: true, eid: e.id});
    m.on('click', () => selectStation(e.id, true));
    S.pins[e.id] = m;
    S.cluster.addLayer(m);
  }
  S.map.addLayer(S.cluster);
  window.addEventListener('resize', () => S.map.invalidateSize({animate: false}));
  if (window.ResizeObserver) new ResizeObserver(() => S.map.invalidateSize({animate: false})).observe(document.getElementById('map'));
  window.addEventListener('orientationchange', () => setTimeout(() => S.map.invalidateSize(), 250));
}

function pinIcon(id) {
  const a = acc(id);
  const b = bucket(a && a.mm, WINDOWS[S.win].th);
  const cls = `pin b${b}${a ? '' : ' nodata'}${S.selStation === id ? ' sel' : ''}`;
  return L.divIcon({className: '', html: `<div class="${cls}">${fmtPin(a && a.mm)}</div>`, iconSize: [36, 26], iconAnchor: [18, 13]});
}

function updatePins() {
  for (const [id, m] of Object.entries(S.pins)) {
    m.setIcon(pinIcon(id));
    const a = acc(id);
    m.unbindTooltip();
    m.bindTooltip(`${S.est[id].nombre}: ${a ? fmt1.format(a.mm) + ' l/m²' : 'sin dato'}`, {direction: 'top', offset: [0, -12]});
    m.setZIndexOffset(S.selStation === id ? 1000 : 0);
  }
  if (S.cluster) S.cluster.refreshClusters();
}

function drawLink() {
  if (S.link) { S.link.remove(); S.link = null; }
  if (S.homePin) { S.homePin.remove(); S.homePin = null; }
  if (!S.selMuni) return;
  const m = S.munByIne[S.selMuni];
  const e = S.est[S.selStation];
  if (!m || !e) return;
  S.homePin = L.marker([m.lat, m.lon], {icon: L.divIcon({className: '', html: '<div class="homepin"></div>', iconSize: [14, 14], iconAnchor: [7, 7]}), interactive: false}).addTo(S.map);
  S.link = L.polyline([[m.lat, m.lon], [e.lat, e.lon]], {color: '#ffb300', weight: 3, dashArray: '6 6', interactive: false}).addTo(S.map);
}

/* ---------- selección ---------- */
function setHash() {
  const h = S.selMuni ? `#m${S.selMuni}` : (S.selStation ? `#e${S.selStation}` : '');
  safe(() => history.replaceState(null, '', location.pathname + location.search + h));
  safe(() => localStorage.setItem('lluvia-sel', h));
}

function selectMunicipio(ine, fly = true) {
  const a = S.asig[ine];
  const m = S.munByIne[ine];
  if (!a || !m) return;
  S.selMuni = ine; S.selStation = a.estacion;
  $('muni').value = m.nombre;
  setHash(); render();
  if (fly) {
    const e = S.est[a.estacion];
    S.map.fitBounds([[m.lat, m.lon], [e.lat, e.lon]], {padding: [60, 60], maxZoom: 12});
  }
}

function selectStation(id, fly = false) {
  if (!S.est[id]) return;
  S.selMuni = null; S.selStation = id;
  $('muni').value = '';
  setHash(); render();
  if (fly) S.map.panTo([S.est[id].lat, S.est[id].lon]);
}

function applyInitialSelection() {
  let h = location.hash || safe(() => localStorage.getItem('lluvia-sel')) || '';
  if (h.startsWith('#m') && S.asig[h.slice(2)]) selectMunicipio(h.slice(2), true);
  else if (h.startsWith('#e') && S.est[h.slice(2)]) selectStation(h.slice(2), true);
}

function initSearch() {
  const dl = $('munis');
  dl.replaceChildren(...[...S.mun].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map(m => el('option', {value: m.nombre})));
  const pick = () => {
    const m = S.munByName.get(norm($('muni').value));
    if (m) { selectMunicipio(m.ine, true); $('muni').blur(); }
  };
  $('muni').addEventListener('change', pick);
  $('muni').addEventListener('input', pick);
  $('geo').addEventListener('click', geolocate);
}

function geolocate() {
  if (!navigator.geolocation) { toast('Tu navegador no permite usar la ubicación.'); return; }
  toast('Buscando tu ubicación…');
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude: la, longitude: lo} = pos.coords;
    let best = null, bd = Infinity;
    for (const m of S.mun) {
      const d = km(la, lo, m.lat, m.lon);
      if (d < bd) { bd = d; best = m; }
    }
    if (best && bd <= MAX_GEO_KM) { toast(''); selectMunicipio(best.ine, true); }
    else toast('Tu ubicación queda fuera de la zona cubierta (provincia de Málaga).');
  }, () => toast('No se pudo obtener tu ubicación. Revisa el permiso del navegador.'), {enableHighAccuracy: false, timeout: 10000, maximumAge: 300000});
}

function km(la1, lo1, la2, lo2) {
  const r = Math.PI / 180, dp = (la2 - la1) * r, dl = (lo2 - lo1) * r;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dl / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(a));
}

function toast(msg) {
  const b = $('banner');
  b.textContent = msg;
  b.hidden = !msg;
}

/* ---------- render ---------- */
function render() {
  renderHeader(); renderLegend(); updatePins(); drawLink(); renderRank(); renderDetail(); renderMini();
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.win === S.win)));
}

function renderMini() {
  const box = $('mini');
  if (!S.selStation) { box.replaceChildren(el('span', {class: 'nm'}, 'Toca una estación del mapa')); return; }
  const a = acc(S.selStation);
  const m = S.selMuni ? S.munByIne[S.selMuni] : null;
  box.replaceChildren(el('span', {class: 'nm'}, m ? m.nombre : S.est[S.selStation].nombre),
    el('span', {}, el('span', {class: 'v'}, a ? fmt1.format(a.mm) : 'Sin dato'), a ? el('span', {class: 'u'}, `l/m² en ${winName(S.win)}`) : ''));
}

function renderHeader() {
  const gen = new Date(S.latest.generado_utc);
  const obs = S.latest.ultima_obs_utc ? new Date(S.latest.ultima_obs_utc) : gen;
  const ageMin = (Date.now() - obs.getTime()) / 60000;
  $('updated').textContent = `Datos hasta las ${tfHM.format(obs)} del ${tfDay.format(obs)}. Revisado a las ${tfHM.format(gen)}. Fuente: AEMET.`;
  if (ageMin > STALE_MIN) toast(`La última observación tiene ${Math.round(ageMin / 60)} h. Puede haber un retraso o fallo temporal de AEMET.`);
  else if ($('banner').textContent.startsWith('La última observación')) toast('');
}

function renderLegend() {
  const th = WINDOWS[S.win].th;
  const labels = legendLabels(th);
  $('legend').replaceChildren(...labels.map((t, i) => {
    const s = el('span', {}, el('i', {style: `background:${colorVar(i)}`}), t);
    return s;
  }), el('span', {}, 'l/m² en ' + winName(S.win)));
}

function renderRank() {
  $('rank-title').textContent = `Más lluvia en ${winUltimas(S.win)}`;
  const th = WINDOWS[S.win].th;
  const rows = Object.keys(S.est).map(id => ({id, a: acc(id)})).filter(r => r.a && r.a.mm > 0).sort((x, y) => y.a.mm - x.a.mm).slice(0, 8);
  const ol = $('rank');
  if (!rows.length) { ol.replaceChildren(el('li', {style: 'cursor:default'}, 'Sin precipitación registrada en este periodo.')); return; }
  ol.replaceChildren(...rows.map(r => el('li', {tabindex: '0', onclick: () => selectStation(r.id, true), onkeydown: e => { if (e.key === 'Enter') selectStation(r.id, true); }},
    el('span', {class: 'dot', style: `background:${colorVar(bucket(r.a.mm, th))}`}),
    el('span', {class: 'nm'}, S.est[r.id].nombre),
    el('span', {class: 'v'}, `${fmt1.format(r.a.mm)} l/m²`))));
}

function renderDetail() {
  const box = $('detail');
  if (!S.selStation) {
    box.replaceChildren(el('h2', {}, 'Elige un municipio o una estación'),
      el('p', {class: 'note'}, 'Busca un municipio arriba, usa «Mi zona» o toca una estación del mapa para ver la lluvia de las últimas horas.'));
    destroyChart();
    return;
  }
  const id = S.selStation, e = S.est[id];
  const m = S.selMuni ? S.munByIne[S.selMuni] : null;
  const asg = m ? S.asig[S.selMuni] : null;
  const a = acc(id);
  const parts = [];
  parts.push(el('h2', {}, m ? m.nombre : e.nombre));
  if (asg) {
    let cls = 'near', txt = `Estación más cercana, a ${fmt1.format(asg.distancia_km)} km`;
    if (asg.propia) { cls = 'ok'; txt = 'Estación propia'; }
    else if (asg.orientativo) { cls = 'warn'; txt = `Dato orientativo: la estación está a ${fmt1.format(asg.distancia_km)} km`; }
    parts.push(el('span', {class: `badge ${cls}`}, txt));
    parts.push(el('div', {class: 'note', style: 'margin-top:6px'}, `Estación ${e.nombre} (${id}), a ${Math.round(e.alt)} m de altitud`));
  } else {
    parts.push(el('div', {class: 'note'}, `Estación ${id}, a ${Math.round(e.alt)} m de altitud`));
  }
  const th = WINDOWS[S.win].th, top = th[th.length - 1];
  const frac = a ? Math.min(1, Math.sqrt(a.mm / top)) : 0;
  const fill = el('div', {class: 'fill', style: `background:${colorVar(bucket(a && a.mm, th))}`});
  const ticks = el('div', {class: 'ticks', 'aria-hidden': 'true'}, ...th.slice(1).map(v =>
    el('span', {class: 'tick', style: `bottom:${Math.sqrt(v / top) * 100}%`}, String(v).replace('.', ','))));
  const gauge = el('div', {class: 'gauge', role: 'img', 'aria-label': a ? `Nivel: ${fmt1.format(a.mm)} litros por metro cuadrado de un máximo de escala de ${top}` : 'Sin dato'},
    el('div', {class: 'tube'}, fill), ticks);
  parts.push(el('div', {class: 'reading'},
    el('div', {class: a ? 'num' : 'num empty'}, a ? fmt1.format(a.mm) : 'Sin dato', a ? el('small', {}, 'l/m²') : ''), gauge));
  requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.height = (frac * 100) + '%'; }));
  const need = WINDOWS[S.win].h;
  let note = `${cap(winUltimas(S.win))}.`;
  if (!a) note += ' La estación no tiene dato.';
  else if (a.horas_con_dato < need) {
    note += ` Con dato en ${a.horas_con_dato} de ${need} h.`;
    if (need >= 48 && a.horas_con_dato < 0.9 * need) note += ' Cifra parcial: el registro horario aún no cubre toda la ventana.';
  }
  parts.push(el('div', {class: 'note'}, note));
  parts.push(el('div', {class: 'chips'}, ...ORDEN.map(w => {
    const x = acc(id, w);
    return el('button', {class: 'chip', type: 'button', 'aria-pressed': String(w === S.win), onclick: () => { S.win = w; render(); }},
      el('b', {}, x ? fmt1.format(x.mm) : '–'), el('span', {}, winShort(w)));
  })));
  const normal = el('div', {class: 'normal'});
  parts.push(normal);
  loadMensual(id).then(d => { if (S.selStation === id && normal.isConnected) renderNormal(normal, id, d); });
  parts.push(el('div', {class: 'seg vistas', role: 'group', 'aria-label': 'Vista'},
    ...[['horas', 'Últimas horas'], ['historico', 'Histórico mensual']].map(([v, t]) =>
      el('button', {type: 'button', 'aria-pressed': String(S.vista === v), onclick: () => { S.vista = v; renderDetail(); }}, t))));
  if (S.vista === 'historico') {
    const hist = el('div', {class: 'hist'}, el('p', {class: 'note'}, 'Cargando histórico…'));
    parts.push(hist);
    box.replaceChildren(...parts);
    destroyChart();
    loadMensual(id).then(d => { if (S.selStation === id && S.vista === 'historico') renderHist(hist, id, d); });
    return;
  }
  parts.push(el('div', {class: 'chartbox'}, el('canvas', {id: 'chart', role: 'img', 'aria-label': 'Lluvia por hora de la estación seleccionada'})));
  box.replaceChildren(...parts);
  drawChart(id);
}

/* ---------- histórico mensual ---------- */
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

async function loadMensual(id) {
  if (id in S.mensual) return S.mensual[id];
  try { S.mensual[id] = await getJSON(`mensual/${id}.json`); } catch (e) { S.mensual[id] = null; }
  return S.mensual[id];
}

function anioActual() { return S.latest && S.latest.mes ? Number(S.latest.mes.slice(0, 4)) : new Date().getFullYear(); }

function statsMensual(d) {
  const sum = Array(12).fill(0), n = Array(12).fill(0);
  for (const [a, fila] of Object.entries(d.anios)) if (Number(a) < anioActual()) fila.forEach((v, i) => { if (v != null) { sum[i] += v; n[i]++; } });
  return sum.map((s, i) => n[i] ? s / n[i] : null);
}

const MESES_LARGOS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const pct = (x, n) => n > 0 ? `${Math.round(100 * x / n)} %` : null;

function filaCmp(etiqueta, valor, maximo, clase) {
  const w = maximo > 0 ? Math.max(1, Math.min(100, 100 * valor / maximo)) : 0;
  return el('div', {class: 'cmp-fila'}, el('span', {class: 'cmp-et'}, etiqueta),
    el('span', {class: 'cmp-barra'}, el('i', {class: clase, style: `width:${w}%`})),
    el('span', {class: 'cmp-v'}, `${fmt1.format(valor)} l/m²`));
}

function renderNormal(box, id, d) {
  const kids = [];
  const mes = S.latest && S.latest.mes;
  if (!d || !mes) { box.replaceChildren(); return; }
  const anio = Number(mes.slice(0, 4)), mi = Number(mes.slice(5, 7)) - 1;
  const media = statsMensual(d);
  const m = S.latest.estaciones[id] && S.latest.estaciones[id].mes;
  if (m && media[mi] != null) {
    const horasTotales = new Date(anio, mi + 1, 0).getDate() * 24;
    const cobertura = m.horas_mes ? m.horas_con_dato / m.horas_mes : 0;
    const desdeDia = tfDay.format(new Date(m.desde_utc));
    const completo = new Date(m.desde_utc).getUTCDate() === 1 && cobertura >= 0.9;
    kids.push(el('h3', {}, `${MESES_LARGOS[mi][0].toUpperCase() + MESES_LARGOS[mi].slice(1)}, mes en curso`));
    if (completo) {
      const hastaHoy = media[mi] * m.horas_mes / horasTotales;
      const mx = Math.max(m.mm, hastaHoy, 0.1);
      kids.push(filaCmp('Registrado', m.mm, mx, 'reg'), filaCmp('Normal hasta hoy', hastaHoy, mx, 'nor'));
      const p = pct(m.mm, hastaHoy);
      kids.push(el('p', {class: 'note'}, `${p ? `Llevas el ${p} de lo normal a estas alturas. ` : ''}Mes completo normal: ${fmt1.format(media[mi])} l/m².`));
    } else {
      const mx = Math.max(m.mm, media[mi], 0.1);
      kids.push(filaCmp('Registrado', m.mm, mx, 'reg'), filaCmp('Mes completo normal', media[mi], mx, 'nor'));
      kids.push(el('p', {class: 'note'}, `El registro horario empezó el ${desdeDia}, así que todavía no es comparable con el mes entero.`));
    }
  }
  const ant = mi === 0 ? [anio - 1, 11] : [anio, mi - 1];
  const vAnt = d.anios[String(ant[0])] && d.anios[String(ant[0])][ant[1]];
  if (vAnt != null && media[ant[1]] != null) {
    const mx = Math.max(vAnt, media[ant[1]], 0.1);
    kids.push(el('h3', {}, `${MESES_LARGOS[ant[1]][0].toUpperCase() + MESES_LARGOS[ant[1]].slice(1)} de ${ant[0]}, mes completo`));
    kids.push(filaCmp('Registrado', vAnt, mx, 'reg'), filaCmp('Normal', media[ant[1]], mx, 'nor'));
    const p = pct(vAnt, media[ant[1]]);
    if (p) kids.push(el('p', {class: 'note'}, `El ${p} de lo normal.`));
  }
  if (kids.length) kids.push(el('p', {class: 'note small'}, `Normal: media de ${MESES_LARGOS[mi]} entre ${Object.keys(d.anios).filter(a => Number(a) < anio).length} años de la serie${d.propia ? '' : ` de ${d.fuente_nombre}`}.`));
  box.replaceChildren(...kids);
}

function renderHist(box, id, d) {
  if (!d || !Object.keys(d.anios).length) {
    box.replaceChildren(el('p', {class: 'note'}, 'Todavía no hay histórico mensual para esta estación.'));
    return;
  }
  const anios = Object.keys(d.anios).sort();
  if (!S.anio || !d.anios[S.anio]) S.anio = anios[anios.length - 1];
  const media = statsMensual(d);
  const fila = d.anios[S.anio];
  const completo = fila.every(v => v != null);
  const total = fila.reduce((s, v) => s + (v || 0), 0);
  const mediaAnual = media.reduce((s, v) => s + (v || 0), 0);
  const sel = el('select', {class: 'anio', 'aria-label': 'Año', onchange: e => { S.anio = e.target.value; renderHist(box, id, d); }},
    ...[...anios].reverse().map(a => el('option', a === S.anio ? {value: a, selected: ''} : {value: a}, a)));
  const kids = [];
  if (!d.propia) kids.push(el('span', {class: 'badge near'}, `Serie de ${d.fuente_nombre}, estación climatológica más cercana, a ${fmt1.format(d.distancia_km)} km`));
  kids.push(el('div', {class: 'anio-row'}, sel,
    el('div', {class: 'note'}, `${S.anio}: ${fmt1.format(total)} l/m²${completo ? '' : ' (hay meses sin dato)'}. Media anual: ${fmt1.format(mediaAnual)} l/m².`)));
  kids.push(el('div', {class: 'chartbox'}, el('canvas', {id: 'chart', role: 'img', 'aria-label': `Lluvia mensual de ${S.anio} frente a la media`})));
  kids.push(el('p', {class: 'note'}, `Media calculada con ${anios.length} años (${anios[0]} a ${anios[anios.length - 1]}). Fuente: climatología de AEMET.`));
  box.replaceChildren(...kids);
  drawMensual(fila, media);
}

function drawMensual(fila, media) {
  destroyChart();
  if (!window.Chart) return;
  const css = getComputedStyle(document.documentElement);
  const cv = n => css.getPropertyValue(n).trim();
  const muted = cv('--muted'), line = cv('--line');
  S.chart = new Chart($('chart'), {
    data: {
      labels: MESES,
      datasets: [
        {type: 'bar', label: 'Mes', data: fila, backgroundColor: cv('--b2'), borderRadius: 3, maxBarThickness: 22, order: 2},
        {type: 'line', label: 'Media', data: media, borderColor: cv('--fg'), borderWidth: 2, pointRadius: 2, tension: .25, order: 1},
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: {labels: {color: muted, boxWidth: 12}},
        tooltip: {callbacks: {label: i => `${i.dataset.label}: ${i.raw == null ? 'sin dato' : fmt1.format(i.raw) + ' l/m²'}`}},
      },
      scales: {
        x: {ticks: {color: muted}, grid: {display: false}},
        y: {beginAtZero: true, ticks: {color: muted, callback: v => fmt1.format(v)}, grid: {color: line}, title: {display: true, text: 'l/m² al mes', color: muted}},
      },
    },
  });
}

/* ---------- embalses ---------- */
async function loadEmbalses() {
  try {
    const d = await getJSON('embalses.json');
    const f1 = x => x == null ? 'sin dato' : `${fmt1.format(x)} %`;
    const lista = Object.entries(d.embalses).sort((a, b) => b[1].capacidad_hm3 - a[1].capacidad_hm3).map(([id, e]) => {
      const media = e.promedio_8_anios_hm3 != null && e.capacidad_hm3 ? 100 * e.promedio_8_anios_hm3 / e.capacidad_hm3 : null;
      const partes = [`Hace una semana ${f1(e.pct_sem_ant)}.`, `Hace un año ${f1(e.pct_anio_ant)}.`];
      if (media != null) partes.push(`Media de 8 años ${f1(media)}.`);
      return el('div', {class: 'emb', role: 'group', 'aria-label': `${e.nombre}: ${f1(e.pct)}`},
        el('div', {class: 'emb-top'}, el('span', {class: 'emb-nom'}, e.nombre), el('span', {class: 'emb-pct'}, f1(e.pct))),
        el('div', {class: 'emb-barra', 'aria-hidden': 'true'},
          el('i', {style: `width:${Math.min(100, e.pct || 0)}%`}), media != null ? el('b', {style: `left:${Math.min(100, media)}%`, title: 'Media de 8 años'}) : ''),
        el('div', {class: 'note'}, `${fmt1.format(e.volumen_hm3)} de ${fmt1.format(e.capacidad_hm3)} hm³. ${partes.join(' ')}`));
    });
    $('emb-lista').replaceChildren(...lista);
    const [a, m, dd] = d.fecha.split('-');
    $('emb-fuente').replaceChildren(`Dato del ${dd}/${m}/${a} a las ${d.hora}. Fuente: `,
      el('a', {href: d.fuente_url, target: '_blank', rel: 'noopener'}, 'SAIH Hidrosur'),
      '. Datos automáticos sin verificar y sin valor oficial. La marca vertical indica la media de los últimos 8 años.');
    $('embalses').hidden = false;
  } catch (e) { $('embalses').hidden = true; }
}

/* ---------- gráfico ---------- */
function destroyChart() { if (S.chart) { S.chart.destroy(); S.chart = null; } }

function drawChart(id) {
  destroyChart();
  if (!window.Chart) return;
  const serie = (S.latest.estaciones[id] && S.latest.estaciones[id].serie) || [];
  const byT = new Map(serie.map(p => [new Date(p.t).getTime(), p.mm]));
  let last = 0;
  for (const st of Object.values(S.latest.estaciones)) for (const p of st.serie) last = Math.max(last, new Date(p.t).getTime());
  if (!last) return;
  const slots = Array.from({length: 24}, (_, i) => last - (23 - i) * 3600000);
  const vals = slots.map(t => byT.has(t) ? byT.get(t) : null);
  const th = WINDOWS['1h'].th;
  const css = getComputedStyle(document.documentElement);
  const cv = n => css.getPropertyValue(n).trim();
  const muted = cv('--muted'), line = cv('--line');
  S.chart = new Chart($('chart'), {
    type: 'bar',
    data: {
      labels: slots.map(t => tfH.format(t)),
      datasets: [{data: vals, backgroundColor: vals.map(v => cv(`--b${bucket(v, th)}`)), borderRadius: 3, maxBarThickness: 18}],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: {display: false},
        tooltip: {callbacks: {
          title: items => `${tfDay.format(slots[items[0].dataIndex])} ${tfHM.format(slots[items[0].dataIndex])} h`,
          label: item => item.raw == null ? 'Sin dato' : `${fmt1.format(item.raw)} l/m²`,
        }},
      },
      scales: {
        x: {ticks: {color: muted, maxRotation: 0, autoSkip: true, maxTicksLimit: 12}, grid: {display: false}, title: {display: true, text: 'Hora (Madrid)', color: muted}},
        y: {beginAtZero: true, suggestedMax: 2, ticks: {color: muted, callback: v => fmt1.format(v)}, grid: {color: line}, title: {display: true, text: 'l/m² por hora', color: muted}},
      },
    },
  });
}

/* ---------- eventos ---------- */
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { S.win = b.dataset.win; if (S.loaded) render(); }));
$('reload').addEventListener('click', load);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.loaded && Date.now() - lastLoad > 600000) load(); });
function estadoRed() {
  if (!navigator.onLine) toast('Sin conexión. Se muestran los últimos datos guardados en este dispositivo.');
  else if ($('banner').textContent.startsWith('Sin conexión')) { toast(''); if (S.loaded) load(); }
}
window.addEventListener('offline', estadoRed);
window.addEventListener('online', estadoRed);
if ('serviceWorker' in navigator && !qs.get('data') && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.loaded) render(); });
setInterval(() => { if (!document.hidden && S.loaded) load(); }, 600000);

load();
})();
</script>
</body>
</html>
